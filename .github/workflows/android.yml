

name: Build SARA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK and AIDL
        shell: bash
        run: |
          set -e

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILD_SDK"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --sdk_root="$BUILD_SDK" --licenses || true

          echo "Installing Android SDK packages..."
          "$SDKMANAGER" --sdk_root="$BUILD_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "ANDROIDSDK=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"

          AIDL_PATH=$(find "$BUILD_SDK/build-tools" -name aidl -type f | head -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "ERROR: AIDL not found"
            exit 1
          fi

          chmod +x "$AIDL_PATH"
          echo "AIDL FOUND: $AIDL_PATH"
          test -x "$AIDL_PATH"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARA-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          
