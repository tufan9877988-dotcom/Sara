name: Build SARA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            openjdk-17-jdk \
            autoconf automake m4 \
            libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev \
            libncurses-dev libffi-dev \
            libssl-dev cmake clang lld \
            python3-pip python3-setuptools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-sara-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sara-v2-${{ runner.os }}-

      - name: Install Android SDK Command Line Tools
        shell: bash
        run: |
          set -e

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$BUILD_SDK/cmdline-tools"
          mkdir -p "$BUILD_SDK/tools/bin"

          cd "$BUILD_SDK/cmdline-tools"

          curl -fL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q tools.zip -d tmp
          rm tools.zip

          rm -rf latest
          mv tmp/cmdline-tools latest
          rmdir tmp

          SDKMANAGER="$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          ln -sf "$SDKMANAGER" "$BUILD_SDK/tools/bin/sdkmanager"

          echo "ANDROID_HOME=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$BUILD_SDK" >> "$GITHUB_ENV"

          echo "$BUILD_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$BUILD_SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$BUILD_SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$BUILD_SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$BUILD_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Show Buildozer log on failure
        if: failure()
        run: |
          ls -la .buildozer/logs || true
          tail -n 120 .buildozer/logs/*.txt || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARA-AI-APK
          path: bin/*.apk
          if-no-files-found: error
